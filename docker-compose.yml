services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - chromadb
      - rabbitmq
    networks:
      - kidognet

  chromadb:
    image: chromadb/chroma
    ports:
      - "8001:8000"
    networks:
      - kidognet

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # Celery 연결용
      - "15672:15672"   # 관리자 UI
    networks:
      - kidognet

networks:
  kidognet:
    driver: bridge