services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      KIDOGKIDOG_DB_PATH: /app/db/kidogkidog.db
    volumes:
      - ./db:/app/db
      - clip-cache:/root/.cache/clip
    depends_on:
      - chromadb
      - rabbitmq
    networks:
      - kidognet

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: celery -A pipeline.tasks worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      KIDOGKIDOG_DB_PATH: /app/db/kidogkidog.db
    volumes:
      - ./db:/app/db
      - clip-cache:/root/.cache/clip
    depends_on:
      - chromadb
      - rabbitmq
    networks:
      - kidognet

  chromadb:
    image: chromadb/chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - kidognet

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # Celery 연결용
      - "15672:15672"   # 관리자 UI
    networks:
      - kidognet

networks:
  kidognet:
    driver: bridge

volumes:
  clip-cache:
  chroma-data:
