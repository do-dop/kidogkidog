services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      # Docker Desktop reaches the SSH tunnel running on the Mac host.
      CHROMA_HOST: host.docker.internal
      CHROMA_PORT: ${CHROMA_PORT:-18001}
      CHROMA_SSL: "false"
      METRICS_ENABLED: "true"
    volumes:
      - ./db:/app/db
      - clip-cache:/root/.cache/clip
    depends_on:
      - rabbitmq
    networks:
      - kidognet

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Solo keeps instrumentation and the metrics HTTP server in one process.
    command: celery -A pipeline.tasks worker --loglevel=info --pool=solo --concurrency=1
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      CHROMA_HOST: host.docker.internal
      CHROMA_PORT: ${CHROMA_PORT:-18001}
      CHROMA_SSL: "false"
      METRICS_ENABLED: "true"
      METRICS_PORT: "8002"
    volumes:
      - ./db:/app/db
      - clip-cache:/root/.cache/clip
    depends_on:
      - rabbitmq
    networks:
      - kidognet

  chromadb:
    # Opt-in only; normal API/worker traffic uses the GCP SSH tunnel.
    profiles: [local-chroma]
    image: chromadb/chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - kidognet

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # Celery 연결용
      - "15672:15672"   # 관리자 UI
    networks:
      - kidognet

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - worker
    networks:
      - kidognet

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - kidognet

networks:
  kidognet:
    driver: bridge

volumes:
  clip-cache:
  chroma-data:
  prometheus-data:
  grafana-data:
