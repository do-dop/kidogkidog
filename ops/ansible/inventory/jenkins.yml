---
# Jenkins가 사용하는 인벤토리. VM 주소는 코드에 두지 않고 환경변수 LAB_VM_HOST로 받는다.
all:
  children:
    worker:
      hosts:
        lab-worker:
          ansible_host: "{{ lookup('env', 'LAB_VM_HOST') }}"
          ansible_user: jenkins-deploy
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts_lab"
