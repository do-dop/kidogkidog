name: Deploy staging

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  API_SERVICE: ${{ vars.CLOUD_RUN_API_SERVICE }}
  WEB_SERVICE: ${{ vars.CLOUD_RUN_WEB_SERVICE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

# 워크플로 전체에는 concurrency를 두지 않는다. 오래된 커밋의 실행이 최신 배포를 취소할 수 있기 때문이다.
# 순서 제어는 배포 job마다 하며, 진행 중인 배포는 취소하지 않는다.

jobs:
  changes:
    name: Check that the commit is still the latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: head
        shell: bash
        run: |
          # 그사이 main이 앞으로 갔으면 새 커밋의 실행이 배포한다. 여기서 끝내야 배포 대기열에도 끼어들지 않는다.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "${main_sha}"
          if [[ "${main_sha}" == "${IMAGE_TAG}" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "건너뜀: ${IMAGE_TAG:0:7} 는 최신 main(${main_sha:0:7})이 아닙니다." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-api:
    needs: changes
    if: needs.changes.outputs.latest == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Decide whether api needs a deploy
        id: target
        shell: bash
        run: |
          # 트래픽을 받는 리비전의 commit-sha 라벨을 기준으로 삼는다(배포에 실패한 리비전은 제외된다).
          # Cloud Run은 이미지를 digest로 저장하므로 이미지 이름에서는 커밋을 알 수 없다.
          service="$(gcloud run services describe "${API_SERVICE}" --region "${REGION}" --format=json || echo '{}')"
          revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)][0].revisionName // empty' <<< "$service")"
          deployed=""
          if [[ -n "$revision" ]]; then
            deployed="$(gcloud run revisions describe "$revision" --region "${REGION}" --format='value(metadata.labels.commit-sha)' || true)"
          fi
          result="$(ops/ci/deploy_target.sh api "$deployed" "${{ github.event_name }}")"
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "api: $(tr '\n' ' ' <<< "$result")" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Authenticate Docker to Artifact Registry
        if: steps.target.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
        if: steps.target.outputs.deploy == 'true'
      - name: Build and push API image
        if: steps.target.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/kidog-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=kidog-api
          cache-to: type=gha,mode=max,scope=kidog-api
      - name: Deploy API to Cloud Run
        if: steps.target.outputs.deploy == 'true'
        run: |
          gcloud run deploy "${API_SERVICE}" \
            --update-labels "commit-sha=${IMAGE_TAG}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/kidog-api:${IMAGE_TAG}" \
            --region "${REGION}" \
            --allow-unauthenticated \
            --port 8000 \
            --memory 8Gi \
            --cpu 2 \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 300 \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --network "${{ vars.VPC_NETWORK }}" \
            --subnet "${{ vars.VPC_SUBNET }}" \
            --network-tags "cloud-run-api" \
            --vpc-egress private-ranges-only \
            --set-env-vars "MYSQL_UNIX_SOCKET=/cloudsql/${{ vars.CLOUD_SQL_INSTANCE }},MYSQL_USER=${{ vars.MYSQL_USER }},MYSQL_DATABASE=${{ vars.MYSQL_DATABASE }},CHROMA_HOST=${{ vars.CHROMA_INTERNAL_IP }},CHROMA_PORT=8000,GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}" \
            --set-secrets "MYSQL_PASSWORD=${{ vars.MYSQL_PASSWORD_SECRET }}:latest,OPENAI_API_KEY=${{ vars.OPENAI_API_KEY_SECRET }}:latest,CELERY_BROKER_URL=${{ vars.CELERY_BROKER_URL_SECRET }}:latest,UPLOAD_API_TOKEN=${{ vars.UPLOAD_API_TOKEN_SECRET }}:latest"

  deploy-web:
    needs: changes
    if: needs.changes.outputs.latest == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Decide whether web needs a deploy
        id: target
        shell: bash
        run: |
          # 트래픽을 받는 리비전의 commit-sha 라벨을 기준으로 삼는다(배포에 실패한 리비전은 제외된다).
          # Cloud Run은 이미지를 digest로 저장하므로 이미지 이름에서는 커밋을 알 수 없다.
          service="$(gcloud run services describe "${WEB_SERVICE}" --region "${REGION}" --format=json || echo '{}')"
          revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)][0].revisionName // empty' <<< "$service")"
          deployed=""
          if [[ -n "$revision" ]]; then
            deployed="$(gcloud run revisions describe "$revision" --region "${REGION}" --format='value(metadata.labels.commit-sha)' || true)"
          fi
          result="$(ops/ci/deploy_target.sh web "$deployed" "${{ github.event_name }}")"
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "web: $(tr '\n' ' ' <<< "$result")" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Authenticate Docker to Artifact Registry
        if: steps.target.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Resolve API URL
        if: steps.target.outputs.deploy == 'true'
        id: api
        run: |
          url="$(gcloud run services describe "${API_SERVICE}" --region "${REGION}" --format='value(status.url)')"
          test -n "${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.target.outputs.deploy == 'true'
      - name: Build and push web image
        if: steps.target.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ui-react
          push: true
          build-args: API_ORIGIN=${{ steps.api.outputs.url }}
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/kidog-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=kidog-web
          cache-to: type=gha,mode=max,scope=kidog-web
      - name: Deploy web to Cloud Run
        if: steps.target.outputs.deploy == 'true'
        run: |
          gcloud run deploy "${WEB_SERVICE}" \
            --update-labels "commit-sha=${IMAGE_TAG}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/kidog-web:${IMAGE_TAG}" \
            --region "${REGION}" \
            --allow-unauthenticated \
            --port 8080
