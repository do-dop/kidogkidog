name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Changed component detection
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        shell: bash
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^ HEAD)"
          if grep -Eq '^(api/|db/|pipeline/|requirements\.txt$|api/Dockerfile$)' <<< "$changed_files"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^ui-react/' <<< "$changed_files"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend syntax and image build
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - name: Check Python syntax
        run: python -m compileall -q api db pipeline
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          tags: kidog-api:ci
          load: true
          cache-from: type=gha,scope=kidog-api
          cache-to: type=gha,mode=max,scope=kidog-api

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-react/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ui-react
          tags: kidog-web:ci
          load: true
          cache-from: type=gha,scope=kidog-web
          cache-to: type=gha,mode=max,scope=kidog-web
